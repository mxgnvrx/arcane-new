# Arcane head implant cavities work on humanoid species, including IPCs.
# Do not change the restriction on the upstream generic augments.
- type: entity
  abstract: true
  parent: SurgeryBase
  id: SurgeryArcaneOpenHeadImplantCavityBase
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepOpenOrganSlot
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    inverse: true
  - type: SurgeryBodyComponentCondition
    whitelist:
      components:
      - HumanoidProfile

- type: entity
  parent: SurgeryArcaneOpenHeadImplantCavityBase
  id: SurgeryOpenBreathingTubeCavity
  name: Open cavity for breathing tube
  components:
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneBreathingTube

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertBreathingTube
  name: Insert breathing tube
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneBreathingTube
  - type: SurgeryOrganCondition
    organ: ArcaneBreathingTube

- type: entity
  parent: SurgeryArcaneOpenHeadImplantCavityBase
  id: SurgeryOpenAntiDropCavity
  name: Prepare cavity for anti-drop implant
  components:
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneAntiDrop

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertAntiDrop
  name: Insert anti-drop implant
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneAntiDrop
  - type: SurgeryOrganCondition
    organ: ArcaneAntiDrop

- type: entity
  parent: SurgeryRemoveAugmentBase
  id: SurgeryRemoveAntiDrop
  name: Remove anti-drop implant
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganCondition
    organ: ArcaneAntiDrop

- type: entity
  parent: SurgeryRemoveAugmentBase
  id: SurgeryRemoveBreathingTube
  name: Remove breathing tube
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganCondition
    organ: ArcaneBreathingTube

- type: entity
  parent: SurgeryArcaneOpenHeadImplantCavityBase
  id: SurgeryOpenCnsRebooterCavity
  name: Prepare cavity for CNS rebooter
  components:
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneCnsRebooter

- type: entity
  parent: SurgeryInstallAugmentBase
  id: SurgeryInsertCnsRebooter
  name: Insert CNS rebooter
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganSlotCondition
    organSlot: ArcaneCnsRebooter
  - type: SurgeryOrganCondition
    organ: ArcaneCnsRebooter

- type: entity
  parent: SurgeryRemoveAugmentBase
  id: SurgeryRemoveCnsRebooter
  name: Remove CNS rebooter
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
  - type: SurgeryPartCondition
    parts: [ Head ]
  - type: SurgeryOrganCondition
    organ: ArcaneCnsRebooter
