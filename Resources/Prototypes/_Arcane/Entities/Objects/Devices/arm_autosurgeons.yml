- type: entity
  parent: BaseAutosurgeonSyndicate
  id: AutosurgeonArmElectrification
  name: syndicate autosurgeon (right arm electrification)
  description: Installs a retractable contact electrode in the right arm. Single use.
  components:
  - type: AutoSurgeon
    entries:
    - targetCategory: ArmRight
      newOrganProto: ArmElectrificationAugment
      createMissingSlot: true

- type: entity
  parent: BaseAutosurgeonSyndicate
  id: AutosurgeonLeftLaserArm
  name: syndicate autosurgeon (left arm laser)
  description: Installs a retractable laser in the left arm. Single use.
  components:
  - type: AutoSurgeon
    entries:
    - targetCategory: ArmLeft
      newOrganProto: LaserArmAugment
      createMissingSlot: true

- type: entity
  parent: BaseAutosurgeonSyndicate
  id: AutosurgeonRightLaserArm
  name: syndicate autosurgeon (right arm laser)
  description: Installs a retractable laser in the right arm. Single use.
  components:
  - type: AutoSurgeon
    entries:
    - targetCategory: ArmRight
      newOrganProto: LaserArmAugment
      createMissingSlot: true
