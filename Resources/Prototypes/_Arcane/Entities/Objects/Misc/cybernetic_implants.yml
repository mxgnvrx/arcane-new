- type: entity
  parent: BaseSubdermalImplant
  id: BluespaceGroundingImplant
  name: bluespace grounding implant
  description: Grounds your bluespace signature in baseline reality, whatever the hell that means.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
    implantComponents:
    - type: BluespaceGrounding

- type: entity
  parent: BaseImplantOnlyImplanter
  id: BluespaceGroundingImplanter
  name: bluespace grounding implanter
  components:
  - type: Implanter
    implant: BluespaceGroundingImplant

- type: entity
  parent: BaseSubdermalImplant
  id: TacticalDeniabilityImplant
  name: tactical deniability implant
  description: An enhanced version of the microbomb that delays detonation and keeps its host out of critical condition.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantationTimeMultiplier: 4
    permanent: true
    implantAction: ActionActivateMicroBomb
    implantComponents:
    - type: TacticalDeniability
  - type: TacticalDeniabilityImplant
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: TimerTrigger
    delay: 10
    beepSound:
      path: /Audio/Machines/Nuke/general_beep.ogg
      params:
        volume: -2
  - type: ExplosionOnTrigger
    keysIn:
    - timer
    explosionType: MicroBomb
    totalIntensity: 120
    intensitySlope: 5
    maxTileIntensity: 30
    canCreateVacuum: false
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
    keysIn:
    - timer

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: TacticalDeniabilityImplanter
  name: tactical deniability implanter
  components:
  - type: Implanter
    implant: TacticalDeniabilityImplant

- type: entity
  parent: BaseSubdermalImplant
  id: TacticalMapImplant
  name: tactical map implant
  description: Provides a map of the target station and marks allies from your operation.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenTacticalMap
  - type: TacticalMapImplant
  - type: UserInterface
    interfaces:
      enum.StationMapUiKey.Key:
        type: TacticalMapBoundUserInterface

- type: entity
  parent: BaseAction
  id: ActionOpenTacticalMap
  name: Open tactical map
  description: View the map of the target station.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon: { sprite: Interface/Actions/pai-map.rsi, state: icon }
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.StationMapUiKey.Key
